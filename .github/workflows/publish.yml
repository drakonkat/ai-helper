name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Tests
        run: bun test

  publish:
    name: Publish Package (OIDC)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Provenance & OIDC Trusted Publishing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to npm
        run: npm publish --provenance --access public
